[package]
name = "midtown"
version = "0.1.0"
edition = "2024"
description = "Midtown daemon - multi-agent workspace manager for Gas Town"
license = "Apache-2.0"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full", "signal"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Error handling
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Channel management
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
fs2 = "0.4"

# Webhook HTTP server
axum = "0.8"
tower-http = { version = "0.6", features = ["trace"] }

# Webhook signature verification
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# CLI utilities
dirs = "6.0"

[dev-dependencies]
tempfile = "3.0"

# Daemon binary
[[bin]]
name = "midtownd"
path = "src/main.rs"

# CLI binary
[[bin]]
name = "midtown"
path = "src/bin/midtown/main.rs"

[lib]
name = "midtown"
path = "src/lib.rs"
