[workspace]
members = [
    ".",
    "crates/minimad-ratatui",
    "crates/fake-claude-cli",
    "crates/fake-codex-cli",
]
resolver = "2"

[package]
name = "midtown"
version = "0.6.3"
edition = "2024"
description = "Midtown - a multi-Claude Code workspace manager, inspired by Gastown"
license = "MIT"
repository = "https://github.com/btucker/midtown"
readme = "README.md"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full", "signal"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Error handling
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Channel management
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1.0", features = ["v4"] }
fs2 = "0.4"
regex = "1"

# Lazy static initialization
once_cell = "1.21"

# Webhook HTTP server
axum = { version = "0.8", features = ["ws", "multipart"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tower-http = { version = "0.6", features = ["trace", "fs", "cors"] }

# Webhook signature verification
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# CLI utilities
dirs = "6.0"
toml = "0.9.11"
toml_edit = "0.23"

# Random number generation (for coworker name selection)
fastrand = "2"

# Daemon process management
daemonize = "0.5"

# TUI for chat interface
ratatui = "0.30"
ratatui-themes = { version = "0.1", features = ["serde"] }
crossterm = { version = "0.29", features = ["event-stream"] }
portable-pty = "0.8"

# Mermaid diagram rendering
selkie-rs = { version = "0.3", default-features = false }

# Syntax highlighting for code blocks
syntect = { version = "5", default-features = false, features = ["default-themes", "default-syntaxes", "regex-fancy"] }

# Async file tailing for instant message updates
tailf = "0.1"
futures = "0.3"
unicode-width = "0.2.0"

# Web Push notifications (VAPID + RFC8030)
web-push-native = { version = "0.4", features = ["vapid", "serialization"] }
jwt-simple = { version = "0.12", default-features = false, features = ["pure-rust"] }
p256 = "0.13"
base64ct = { version = "1", features = ["alloc"] }
reqwest = { version = "0.12", features = ["rustls-tls", "json", "blocking"], default-features = false }
http = "1"
shell-escape = "0.1.5"
minimad-ratatui = { path = "crates/minimad-ratatui" }
tempfile = "3.0"

[dev-dependencies]
ntest = "0.9"  # Test utilities including timeout attribute
proptest = "1.7"
# Web E2E test dependencies
tokio-tungstenite = "0.26"  # WebSocket client for E2E tests
futures-util = "0.3"  # Stream extensions for WebSocket handling
reqwest = { version = "0.12", features = ["rustls-tls", "json", "blocking", "multipart"], default-features = false }  # HTTP client with blocking for tests

# Git hooks - runs on cargo test
[dev-dependencies.cargo-husky]
version = "1"
default-features = false
features = ["user-hooks"]

# Main CLI binary
[[bin]]
name = "midtown"
path = "src/bin/midtown/main.rs"

[lib]
name = "midtown"
path = "src/lib.rs"
