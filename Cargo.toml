[package]
name = "midtown"
version = "0.1.0"
edition = "2024"
description = "Midtown daemon - multi-agent workspace manager for Gas Town"
license = "Apache-2.0"
repository = "https://github.com/btucker/midtown"
readme = "README.md"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full", "signal"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Error handling
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Channel management
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
fs2 = "0.4"

# Lazy static initialization
once_cell = "1.21"

# Webhook HTTP server
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["trace", "fs", "cors"] }

# Webhook signature verification
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# CLI utilities
dirs = "6.0"
toml = "0.9.11"

# Random number generation (for coworker name selection)
fastrand = "2"

# Daemon process management
daemonize = "0.5"

# TUI for chat interface
ratatui = "0.29"
crossterm = { version = "0.29", features = ["event-stream"] }

# Async file tailing for instant message updates
tailf = "0.1"
futures = "0.3"

[dev-dependencies]
tempfile = "3.0"
ntest = "0.9"  # Test utilities including timeout attribute

# Git hooks - runs on cargo test
[dev-dependencies.cargo-husky]
version = "1"
default-features = false
features = ["precommit-hook", "run-cargo-fmt", "run-cargo-clippy"]

# Main CLI binary
[[bin]]
name = "midtown"
path = "src/bin/midtown/main.rs"

[lib]
name = "midtown"
path = "src/lib.rs"
