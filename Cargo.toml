[package]
name = "midtown"
version = "0.1.0"
edition = "2024"
description = "Midtown daemon - multi-agent workspace manager"
license = "Apache-2.0"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full", "signal"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Error handling
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "midtownd"
path = "src/main.rs"

[lib]
name = "midtown"
path = "src/lib.rs"
