name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run tests with coverage
        run: ./scripts/with-isolated-home.sh cargo llvm-cov --all-features --lcov --output-path lcov-unit.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: lcov-unit.info
          retention-days: 1

  e2e:
    name: E2E - ${{ matrix.test }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - test: daemon_e2e
            flags: "--ignored --test-threads=1 --skip installs_required_plugins"
          - test: zellij_start_e2e
            flags: "--ignored --test-threads=1"
          - test: tmux_e2e
            flags: "--ignored --test-threads=1"
          - test: full_stack_e2e
            flags: "--ignored --test-threads=1 --skip nudge_reaches_real_claude"
          - test: nudge_delivery_e2e
            flags: "--ignored"
          - test: chat_e2e
            flags: "--ignored"
            continue_on_error: true
          - test: task_sharing
            flags: ""
          - test: polling_degradation
            flags: ""
          - test: spawn_race_test
            flags: ""
          - test: tailf_integration
            flags: ""
          - test: idle_break_e2e
            flags: ""
          - test: worktree_registry_e2e
            flags: "--ignored --test-threads=1"
          - test: zellij_e2e
            flags: "--ignored --test-threads=1"
          # webhook_e2e is excluded from CI - tests are flaky due to timing
          # issues in GitHub Actions. Run locally with:
          # cargo test --test webhook_e2e -- --ignored --test-threads=1
      fail-fast: false
    env:
      MIDTOWN_WEBHOOK_PORT: 0
      MIDTOWN_CHAT_MONITOR: 0
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install tmux and Zellij
        run: |
          sudo apt-get update && sudo apt-get install -y tmux
          # Install Zellij for Zellij-based E2E tests
          curl -L https://github.com/zellij-org/zellij/releases/latest/download/zellij-x86_64-unknown-linux-musl.tar.gz | sudo tar xz -C /usr/local/bin

      - name: Install WASM target
        run: rustup target add wasm32-wasip1

      - name: Install Zellij
        if: matrix.test == 'zellij_start_e2e'
        run: |
          ZELLIJ_VERSION=0.43.1
          curl -fsSL "https://github.com/zellij-org/zellij/releases/download/v${ZELLIJ_VERSION}/zellij-x86_64-unknown-linux-musl.tar.gz" -o /tmp/zellij.tar.gz
          tar -xzf /tmp/zellij.tar.gz -C /tmp
          ZELLIJ_BIN="$(find /tmp -maxdepth 3 -type f -name zellij | head -n 1)"
          test -n "${ZELLIJ_BIN}"
          sudo install "${ZELLIJ_BIN}" /usr/local/bin/zellij
          zellij --version

      - name: Install Claude Code
        run: curl -fsSL https://claude.ai/install.sh | bash

      - name: Configure git
        run: |
          git config --global user.email "e2e@midtown.test"
          git config --global user.name "Midtown E2E"
          git config --global init.defaultBranch main

      - name: Start tmux server
        run: tmux start-server

      - name: Run ${{ matrix.test }} with coverage
        run: ./scripts/with-isolated-home.sh cargo llvm-cov --no-report --test ${{ matrix.test }} -- ${{ matrix.flags }}
        continue-on-error: ${{ matrix.continue_on_error == true }}

      - name: Generate coverage report
        run: cargo llvm-cov report --lcov --output-path lcov-${{ matrix.test }}.info
        if: always()

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.test }}
          path: lcov-${{ matrix.test }}.info
          retention-days: 1
        if: always()

  coverage:
    name: Upload Coverage
    needs: [test, e2e]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: List coverage files
        run: ls -la *.info || echo "No coverage files found"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: "*.info"
          fail_ci_if_error: false

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check
