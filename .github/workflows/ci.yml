name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run tests with coverage
        run: cargo llvm-cov --all-features --lcov --output-path lcov-unit.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: lcov-unit.info
          retention-days: 1

  e2e:
    name: E2E - ${{ matrix.test }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - test: daemon_e2e
            flags: "--ignored --test-threads=1 --skip installs_required_plugins"
          - test: tmux_e2e
            flags: "--ignored --test-threads=1"
          - test: full_stack_e2e
            flags: "--ignored --test-threads=1 --skip nudge_reaches_real_claude"
          - test: nudge_delivery_e2e
            flags: "--ignored"
          - test: chat_e2e
            flags: "--ignored"
            continue_on_error: true
          - test: task_sharing
            flags: ""
          - test: polling_degradation
            flags: ""
          - test: spawn_race_test
            flags: ""
          - test: tailf_integration
            flags: ""
          - test: idle_break_e2e
            flags: ""
      fail-fast: false
    env:
      MIDTOWN_WEBHOOK_PORT: 0
      MIDTOWN_CHAT_MONITOR: 0
      MIDTOWN_LEAD_COMMAND: "sleep 300"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Install Claude Code
        run: curl -fsSL https://claude.ai/install.sh | bash

      - name: Configure git
        run: |
          git config --global user.email "e2e@midtown.test"
          git config --global user.name "Midtown E2E"
          git config --global init.defaultBranch main

      - name: Start tmux server
        run: tmux start-server

      - name: Run ${{ matrix.test }} with coverage
        run: cargo llvm-cov --no-report --test ${{ matrix.test }} -- ${{ matrix.flags }}
        continue-on-error: ${{ matrix.continue_on_error == true }}

      - name: Generate coverage report
        run: cargo llvm-cov report --lcov --output-path lcov-${{ matrix.test }}.info
        if: always()

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.test }}
          path: lcov-${{ matrix.test }}.info
          retention-days: 1
        if: always()

  coverage:
    name: Upload Coverage
    needs: [test, e2e]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: List coverage files
        run: ls -la *.info || echo "No coverage files found"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: "*.info"
          fail_ci_if_error: false

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check
