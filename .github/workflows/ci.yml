name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --all-features

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run daemon e2e tests
        run: cargo test --release --all-features --test daemon_e2e -- --ignored --test-threads=1
        env:
          MIDTOWN_WEBHOOK_PORT: "0"
          MIDTOWN_CHAT_MONITOR: "0"

      - name: Run tmux e2e tests
        run: cargo test --release --all-features --test tmux_e2e -- --ignored
        env:
          MIDTOWN_LEAD_COMMAND: "sleep 300"

      - name: Run nudge delivery e2e tests
        run: cargo test --release --all-features --test nudge_delivery_e2e -- --ignored

      # Chat e2e tests require a real terminal for TUI rendering and time out in CI
      # Run these locally: cargo test --release --all-features --test chat_e2e -- --ignored

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check
