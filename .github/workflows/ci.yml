name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run tests with coverage
        run: ./scripts/with-isolated-home.sh cargo llvm-cov --all-features --lcov --output-path lcov-unit.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: lcov-unit.info
          retention-days: 1

  e2e:
    name: E2E - ${{ matrix.test }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - test: daemon_e2e
            flags: "--ignored --test-threads=1 --skip installs_required_plugins"
          # zellij_start_e2e removed - midtown start no longer creates Zellij sessions (use midtown view)
          # tmux_e2e removed - this PR deletes tmux.rs and all tmux integration
          - test: full_stack_e2e
            flags: "--ignored --test-threads=1 --skip nudge_reaches_real_claude"
          # nudge_delivery_e2e removed - this PR deletes the test file
          - test: chat_e2e
            flags: "--ignored"
            continue_on_error: true
          - test: task_sharing
            flags: ""
          - test: polling_degradation
            flags: ""
          - test: spawn_race_test
            flags: ""
          - test: tailf_integration
            flags: ""
          - test: idle_break_e2e
            flags: ""
          - test: worktree_registry_e2e
            flags: "--ignored --test-threads=1"
          # webhook_e2e is excluded from CI - tests are flaky due to timing
          # issues in GitHub Actions. Run locally with:
          # cargo test --test webhook_e2e -- --ignored --test-threads=1
      fail-fast: false
    env:
      MIDTOWN_WEBHOOK_PORT: 0
      MIDTOWN_CHAT_MONITOR: 0
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install tmux
        run: |
          sudo apt-get update && sudo apt-get install -y tmux

      - name: Install WASM target
        run: rustup target add wasm32-wasip1

      - name: Install Claude Code
        run: curl -fsSL https://claude.ai/install.sh | bash

      - name: Configure git
        run: |
          git config --global user.email "e2e@midtown.test"
          git config --global user.name "Midtown E2E"
          git config --global init.defaultBranch main

      - name: Start tmux server
        run: tmux start-server

      - name: Run ${{ matrix.test }} with coverage
        run: ./scripts/with-isolated-home.sh cargo llvm-cov --no-report --test ${{ matrix.test }} -- ${{ matrix.flags }}
        continue-on-error: ${{ matrix.continue_on_error == true }}

      - name: Generate coverage report
        run: |
          if find target/llvm-cov-target -name '*.profraw' -print -quit | grep -q .; then
            cargo llvm-cov report --lcov --output-path lcov-${{ matrix.test }}.info
          else
            echo "No .profraw files found; skipping coverage report for ${{ matrix.test }}"
          fi
        if: always()

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.test }}
          path: lcov-${{ matrix.test }}.info
          retention-days: 1
        if: always()

  coverage:
    name: Upload Coverage
    needs: [test, e2e]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: List coverage files
        run: ls -la *.info || echo "No coverage files found"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: "*.info"
          fail_ci_if_error: false

  web:
    name: Web Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-app/package-lock.json

      - name: Install dependencies
        run: cd web-app && npm ci

      - name: Run tests
        run: cd web-app && npm test

      - name: Build
        run: cd web-app && npm run build

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check
