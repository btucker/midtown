name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --all-features

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    env:
      MIDTOWN_WEBHOOK_PORT: 0
      MIDTOWN_CHAT_MONITOR: 0
      MIDTOWN_LEAD_COMMAND: "sleep 300"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Install Claude Code
        run: curl -fsSL https://claude.ai/install.sh | bash

      - name: Configure git
        run: |
          git config --global user.email "e2e@midtown.test"
          git config --global user.name "Midtown E2E"
          git config --global init.defaultBranch main

      - name: Start tmux server
        run: tmux start-server

      - name: Build release binary
        run: cargo build --release

      - name: Run daemon_e2e
        run: cargo test --release --test daemon_e2e -- --ignored --test-threads=1 --skip installs_required_plugins

      - name: Run tmux_e2e
        run: cargo test --release --test tmux_e2e -- --ignored --test-threads=1

      - name: Run full_stack_e2e
        run: cargo test --release --test full_stack_e2e -- --ignored --test-threads=1

      - name: Run nudge_delivery_e2e
        run: cargo test --release --test nudge_delivery_e2e -- --ignored

      - name: Run chat_e2e
        run: cargo test --release --test chat_e2e -- --ignored
        continue-on-error: true

      - name: Run task_sharing
        run: cargo test --release --test task_sharing

      - name: Run polling_degradation
        run: cargo test --release --test polling_degradation

      - name: Run spawn_race_test
        run: cargo test --release --test spawn_race_test

      - name: Run tailf_integration
        run: cargo test --release --test tailf_integration

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check
