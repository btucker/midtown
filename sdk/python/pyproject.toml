[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "midtown-sdk"
version = "0.1.0"
description = "Python SDK for midtown workflow scripts"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "pluggy>=1.0.0",
]

[project.optional-dependencies]
transitions = ["transitions>=0.9"]
dev = ["pytest>=7.0"]

[dependency-groups]
dev = ["pytest>=8.4.2", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["midtown"]

[tool.uv]
# Allow `uv run workflow.py` to find the SDK without installation.
# Users can also `uv add midtown-sdk` to add it as a dependency.
